<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="Career Timeline">
<title>Career Timeline</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a1740"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}

</style>
<rect width="900" height="56" rx="12" fill="url(#bg)"/>
<rect x="1" y="1" width="898" height="54" rx="11" fill="none" stroke="url(#acc)" stroke-width="1.2" opacity=".7"/>
<rect x="20" y="14" width="5" height="28" rx="2.5" fill="url(#acc)"><animate attributeName="height" values="12;28;12" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="22;14;22" dur="3s" repeatCount="indefinite"/></rect>
<text x="42" y="36" font-size="22" font-weight="700" fill="#ffffff">Career Timeline</text>
<circle cx="870" cy="28" r="5" fill="#14b8a6"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
