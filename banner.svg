<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Hira Aslam, Data Analyst. Skills: SQL, Python, MS Excel, Google Sheets, C++, GitHub Actions, HTML/CSS">
<title>Hira Aslam, Data Analyst. Skills: SQL, Python, MS Excel, Google Sheets, C++, GitHub Actions, HTML/CSS</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a1740"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.name{opacity:0;animation:rise .9s ease .1s forwards}
.sub{opacity:0;animation:rise .9s ease .35s forwards}
.chip{opacity:0;animation:rise .6s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
<rect width="1000" height="250" rx="16" fill="url(#bg)"/>
<circle cx="860" cy="60" r="90" fill="#8b5cf6" opacity=".14"><animate attributeName="cy" values="60;95;60" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="130" cy="235" r="70" fill="#14b8a6" opacity=".12"><animate attributeName="cx" values="130;180;130" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="640" cy="20" r="50" fill="#3b82f6" opacity=".12"><animate attributeName="r" values="50;65;50" dur="5s" repeatCount="indefinite"/></circle>
<rect x="1" y="1" width="998" height="248" rx="15" fill="none" stroke="url(#acc)" stroke-width="2" opacity=".85"/>
<text class="name" x="50" y="100" font-size="58" font-weight="800" fill="url(#acc)">Hira Aslam</text>
<text class="sub" x="52" y="142" font-size="22" fill="#c9d1d9" letter-spacing="4">DATA ANALYST</text>
<g class="chip" style="animation-delay:0.60s"><rect x="50" y="180" width="59" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="79.5" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">SQL</text></g><g class="chip" style="animation-delay:0.75s"><rect x="119" y="180" width="86" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="162.0" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Python</text></g><g class="chip" style="animation-delay:0.90s"><rect x="215" y="180" width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="267.0" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">MS Excel</text></g><g class="chip" style="animation-delay:1.05s"><rect x="329" y="180" width="149" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="403.5" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Google Sheets</text></g><g class="chip" style="animation-delay:1.20s"><rect x="488" y="180" width="59" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="517.5" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">C++</text></g><g class="chip" style="animation-delay:1.35s"><rect x="557" y="180" width="158" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="636.0" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">GitHub Actions</text></g><g class="chip" style="animation-delay:1.50s"><rect x="725" y="180" width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="url(#acc)" stroke-width="1.5"/><text x="777.0" y="202" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">HTML/CSS</text></g>
</svg>
